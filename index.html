<!doctype html>
<html lang="en-BD">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Applies a saved light/dark choice before the first paint, so prerendered pages don't flash
         the other theme while the app's JavaScript loads (the "system" setting is handled by CSS).
         Same storage key as src/store/themeStore.ts. The CSP allows this exact script by its hash
         (scripts/prerender.mjs computes it), so any edit here is picked up on the next build. -->
    <script>try{var t=JSON.parse(localStorage.getItem("aicvbuilderbd-theme")).state.theme;if(t==="dark"||t==="light")document.documentElement.classList.add(t)}catch(e){}</script>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <!-- API host (API_URL in src/lib/api.ts): opened early so the first data request skips DNS/TLS setup.
         No crossorigin attribute: requests send credentials, which use that connection pool. -->
    <link rel="preconnect" href="https://ownwl9o5ma.c39.airoapp.ai" />
    <meta name="application-name" content="AI CV Builder BD" />
    <!--head:start-->
    <title data-prerender>AI CV Builder BD – Free Online CV Maker for Bangladesh</title>
    <meta
      data-prerender
      name="description"
      content="Free AI CV builder online for Bangladesh. Make an ATS-friendly CV in Bangla or English, check it with our AI ATS checker and download a free PDF."
    />
    <!--head:end-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
