<!doctype html>
<html lang="en-BD">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Applies a saved light/dark choice before the first paint, so prerendered pages don't flash
         the other theme while the app's JavaScript loads (the "system" setting is handled by CSS).
         Same storage key as src/store/themeStore.ts. The CSP allows this exact script by its hash
         (scripts/prerender.mjs computes it), so any edit here is picked up on the next build. -->
    <script>try{var t=JSON.parse(localStorage.getItem("aicvbuilderbd-theme")).state.theme;if(t==="dark"||t==="light")document.documentElement.classList.add(t)}catch(e){}</script>
    <!-- Google tag (gtag.js) for Google Ads AW-18454059893. On every page, so Google Ads finds it and
         measures conversions (src/lib/analytics.ts). Consent mode: denied by default in the EEA, UK and
         Switzerland until the visitor accepts in ConsentBanner, granted elsewhere unless they declined
         (same storage key as ConsentBanner). Page views are sent by ConsentBanner on each route change.
         The CSP allows the inline part by its hash (scripts/prerender.mjs), so edits are picked up on build. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18454059893"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}window.gtag=gtag;(function(){var c=null;try{c=localStorage.getItem("analytics-consent")}catch(e){}var v=function(s){return{ad_storage:s,ad_user_data:s,ad_personalization:s,analytics_storage:s}};if(c==="granted"||c==="denied"){gtag("consent","default",v(c))}else{var r=v("denied");r.region=["AT","BE","BG","HR","CY","CZ","DK","EE","FI","FR","DE","GR","HU","IS","IE","IT","LV","LI","LT","LU","MT","NL","NO","PL","PT","RO","SK","SI","ES","SE","GB","CH"];r.wait_for_update=500;gtag("consent","default",r);gtag("consent","default",v("granted"))}})();gtag("js",new Date());gtag("config","AW-18454059893",{send_page_view:false});</script>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <!-- API host (API_URL in src/lib/api.ts): opened early so the first data request skips DNS/TLS setup.
         No crossorigin attribute: requests send credentials, which use that connection pool. -->
    <link rel="preconnect" href="https://ownwl9o5ma.c39.airoapp.ai" />
    <meta name="application-name" content="AI CV Builder BD" />
    <!--head:start-->
    <title data-prerender>AI CV Builder BD – Free Online CV Maker for Bangladesh</title>
    <meta
      data-prerender
      name="description"
      content="Free AI CV builder online for Bangladesh. Make an ATS-friendly CV in Bangla or English, check it with our AI ATS checker and download a free PDF."
    />
    <!--head:end-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
